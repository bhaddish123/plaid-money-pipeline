name: plaid-sync

on:
  schedule:
    - cron: "17 0,12 * * *"   # every 12 hours (~8:17 AM / 8:17 PM Eastern)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: plaid-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull new transactions from Plaid
        env:
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
          PLAID_ENV: production
        run: python sync.py > /dev/null

      - name: Export recent months for the Money Breakdown page
        run: python export_txns.py "$(date -u -d '-2 month' +%Y-%m)" > /dev/null

      - name: Commit refreshed data
        run: |
          git config user.name "plaid-sync bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No new transactions."; exit 0; fi
          git commit -m "sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
